<svg width="760" height="190" viewBox="0 0 760 190" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Inter, system-ui, sans-serif">
  <rect width="760" height="190" fill="#ffffff" />

  <!-- Leaf -->
  <rect x="20" y="20" width="128" height="110" rx="16" fill="#5c8a7a" />
  <text x="84" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#24313a">Leaf</text>
  <text x="84" y="171" text-anchor="middle" font-size="12" fill="#57666d">#5c8a7a</text>

  <!-- Wave -->
  <rect x="168" y="20" width="128" height="110" rx="16" fill="#6fa6d8" />
  <text x="232" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#24313a">Wave</text>
  <text x="232" y="171" text-anchor="middle" font-size="12" fill="#57666d">#6fa6d8</text>

  <!-- Lavender -->
  <rect x="316" y="20" width="128" height="110" rx="16" fill="#a7a1d6" />
  <text x="380" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#24313a">Lavender</text>
  <text x="380" y="171" text-anchor="middle" font-size="12" fill="#57666d">#a7a1d6</text>

  <!-- Dot -->
  <rect x="464" y="20" width="128" height="110" rx="16" fill="#f4a7b8" />
  <text x="528" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#24313a">Dot</text>
  <text x="528" y="171" text-anchor="middle" font-size="12" fill="#57666d">#f4a7b8</text>

  <!-- Mint -->
  <rect x="612" y="20" width="128" height="110" rx="16" fill="#e6f1f2" stroke="#dde8e8" stroke-width="1" />
  <text x="676" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#24313a">Mint</text>
  <text x="676" y="171" text-anchor="middle" font-size="12" fill="#57666d">#e6f1f2</text>
</svg>
