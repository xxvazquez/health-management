name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: {}

# Changing a secret's value in GitHub does NOT re-run this workflow —
# there's no such trigger event. If you add/rotate BUG_EMAIL,
# RESEND_API_KEY, NOTES_FROM, REMINDERS_FROM, or any of the VAPID secrets
# without also touching a file under supabase/functions/, the live Edge
# Functions keep running with whatever they last had (or nothing, if this
# has never run) until you manually run this workflow from the Actions tab.
#
# NOTES_FROM / REMINDERS_FROM must be an address on a domain verified in
# Resend (e.g. "Lauva <notes@lauva.pl>"). Left unset, both functions fall
# back to Resend's shared onboarding@resend.dev sender, which only delivers
# to the Resend account's own address — so partner/reminder emails to
# anyone else are rejected. report-bug is unaffected (it mails BUG_EMAIL,
# the account owner).

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function under supabase/functions
        run: |
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            supabase functions deploy "$fn" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          done

      # Every secret an Edge Function needs is pushed into Supabase's own
      # secret store here, straight from GitHub Actions secrets — none of
      # this flows through `npm run build`, so none of it reaches the
      # static bundle deploy.yml publishes to GitHub Pages.
      #
      # Only secrets that actually have a value are pushed: an unset GitHub
      # secret must never overwrite a good value already in Supabase (e.g.
      # NOTES_FROM / RESEND_API_KEY set by hand in the dashboard). So the
      # safe way to add or rotate one of these is: set it in the GitHub
      # Actions secrets, THEN run this workflow.
      - name: Sync function secrets
        env:
          BUG_EMAIL: ${{ secrets.BUG_EMAIL }}
          BUG_REPORT_FROM: ${{ secrets.BUG_REPORT_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTES_FROM: ${{ secrets.NOTES_FROM }}
          REMINDERS_FROM: ${{ secrets.REMINDERS_FROM }}
          VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          args=()
          for key in BUG_EMAIL BUG_REPORT_FROM RESEND_API_KEY NOTES_FROM REMINDERS_FROM VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            val="${!key}"
            [ -n "$val" ] && args+=("$key=$val")
          done
          if [ ${#args[@]} -gt 0 ]; then
            supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" "${args[@]}"
          fi
