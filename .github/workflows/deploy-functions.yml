name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function under supabase/functions
        run: |
          for dir in supabase/functions/*/; do
            fn="$(basename "$dir")"
            supabase functions deploy "$fn" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          done

      # Every secret an Edge Function needs is pushed into Supabase's own
      # secret store here, straight from GitHub Actions secrets — none of
      # this flows through `npm run build`, so none of it reaches the
      # static bundle deploy.yml publishes to GitHub Pages. VAPID_SUBJECT
      # is optional — breakfast-reminder-cron falls back to BUG_EMAIL if
      # it's unset.
      - name: Sync function secrets
        run: |
          supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            BUG_EMAIL="${{ secrets.BUG_EMAIL }}" \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            VAPID_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}" \
            VAPID_PRIVATE_KEY="${{ secrets.VAPID_PRIVATE_KEY }}" \
            VAPID_SUBJECT="${{ secrets.VAPID_SUBJECT }}"
