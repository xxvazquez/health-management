name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # Served from lauva.pl (custom domain, see public/CNAME) — a custom
        # domain always serves from the root, so NEXT_PUBLIC_BASE_PATH must
        # stay unset here. Only set it back to /${{ github.event.repository.name }}
        # if the custom domain is ever removed and this reverts to a plain
        # https://<user>.github.io/<repo>/ project page.
        #
        # NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are
        # public by Supabase's own design (protection comes from Row Level
        # Security, not from keeping them secret) but still live in repo
        # secrets here rather than committed, so this file works whether or
        # not cloud sync has been set up yet — set both under Settings ->
        # Secrets and variables -> Actions to enable it.
        #
        # NEXT_PUBLIC_VAPID_PUBLIC_KEY is the same story — a Web Push
        # VAPID *public* key is meant to be handed to the browser, unlike
        # its private counterpart (which only ever lives server-side, as a
        # Supabase secret — see deploy-functions.yml).
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
